# Vault Examples for k8s-operations
# These examples show how to configure and use Vault in the project

---
# Vault Helm values for production deployment

# vault-values.yaml
server:
  # Enable HA mode with Raft storage
  ha:
    enabled: true
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        cluster_name = "vault-integrated-storage"
        storage "raft" {
          path = "/vault/data"
          node_id = "vault-{{ HOSTNAME }}"
        }
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = "true"
        }
        service_registration "kubernetes" {}

  # Storage configuration
  dataStorage:
    enabled: true
    size: 15Gi
    storageClass: rook-ceph-block
    accessModes:
    - ReadWriteOnce

  # Resource limits
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Affinity for spreading across nodes
  affinity: ""
  
  # Extra environment variables
  extraEnvironmentVars:
    VAULT_LOG_LEVEL: debug

  # Readiness and liveness probes
  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true
    port: 8200
  livenessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true
    port: 8200

  # Service configuration
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  # Ingress configuration (if exposing Vault UI)
  ingress:
    enabled: false

---
# Vault VirtualService for secure access

apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: vault-vs
  namespace: vault
spec:
  hosts:
  - "vault.jarakube.com"
  gateways:
  - istio-ingress-internal/jarakube-com-internal-shared-gateway
  http:
  - match:
    - uri:
        prefix: /ui/
    - uri:
        prefix: /v1
    - uri:
        prefix: /
    route:
    - destination:
        host: vault.vault.svc.cluster.local
        port:
          number: 8200

---
# Vault Certificate for TLS

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-cert
  namespace: vault
spec:
  secretName: vault-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "vault.jarakube.com"
  - "vault.jarakube.com"

---
# Vault Namespace

apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    name: vault
    app.kubernetes.io/name: vault

---
# Vault auto-unseal CronJob

apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unseal
  namespace: vault
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: vault-auto-unseal
          restartPolicy: OnFailure
          containers:
          - name: auto-unseal
            image: bitnami/kubectl:latest
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/scripts/auto-unseal.sh"]
            env:
            - name: VAULT_NAMESPACE
              value: vault
            - name: VAULT_POD_SELECTOR
              value: "app.kubernetes.io/name=vault,component=server"
            - name: UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-key
                  key: unseal_key
            volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1001
              capabilities:
                drop: ["ALL"]
          volumes:
          - name: script
            configMap:
              name: vault-auto-unseal-script
              defaultMode: 0555

---
# Vault auto-unseal script ConfigMap

apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-auto-unseal-script
  namespace: vault
data:
  auto-unseal.sh: |
    #!/bin/sh
    set -e
    
    NAMESPACE="${VAULT_NAMESPACE:-vault}"
    POD_SELECTOR="${VAULT_POD_SELECTOR:-app.kubernetes.io/name=vault,component=server}"
    UNSEAL_KEY="${UNSEAL_KEY}"
    
    echo "Starting Vault auto-unseal process"
    
    # Get all Vault pods
    PODS=$(kubectl get pods -n "$NAMESPACE" -l "$POD_SELECTOR" -o jsonpath='{.items[*].metadata.name}')
    
    if [ -z "$PODS" ]; then
      echo "No Vault pods found with selector: $POD_SELECTOR"
      exit 1
    fi
    
    echo "Found Vault pods: $PODS"
    
    # Check if any pod is sealed
    for POD in $PODS; do
      STATUS=$(kubectl exec -n "$NAMESPACE" "$POD" -c vault -- vault status -format=json 2>/dev/null | grep -o '"sealed":[^,]*' | cut -d: -f2)
      
      if [ "$STATUS" = "true" ]; then
        echo "Pod $POD is sealed, unsealing..."
        kubectl exec -n "$NAMESPACE" "$POD" -c vault -- vault operator unseal "$UNSEAL_KEY"
        sleep 2
        # Check if unsealed
        STATUS=$(kubectl exec -n "$NAMESPACE" "$POD" -c vault -- vault status -format=json 2>/dev/null | grep -o '"sealed":[^,]*' | cut -d: -f2)
        if [ "$STATUS" = "false" ]; then
          echo "Pod $POD unsealed successfully"
        else
          echo "Failed to unseal pod $POD"
          exit 1
        fi
      else
        echo "Pod $POD is already unsealed"
      fi
    done
    
    echo "Vault auto-unseal completed successfully"

---
# Vault auto-unseal RBAC

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auto-unseal
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-auto-unseal
  namespace: vault
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-auto-unseal
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-auto-unseal
subjects:
- kind: ServiceAccount
  name: vault-auto-unseal
  namespace: vault

---
# Vault unseal key Secret

apiVersion: v1
kind: Secret
metadata:
  name: vault-unseal-key
  namespace: vault
type: Opaque
data:
  # Replace with your base64-encoded unseal key
  unseal_key: <base64-encoded-unseal-key>

---
# Vault token Secret (for External Secrets)

apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: vault
type: Opaque
data:
  # Replace with your base64-encoded Vault token
  token: <base64-encoded-vault-token>

---
# Vault OIDC configuration script

#!/bin/bash
# infrastructure/vault/oidc/apply-keycloak-oidc.sh

set -euo pipefail

# Configuration
VAULT_NAMESPACE="${VAULT_NAMESPACE:-vault}"
VAULT_TOKEN_SECRET="${VAULT_TOKEN_SECRET:-vault-token}"
VAULT_EXTERNAL_URL="${VAULT_EXTERNAL_URL:-https://vault.jarakube.com}"
KEYCLOAK_NAMESPACE="${KEYCLOAK_NAMESPACE:-keycloak}"
KEYCLOAK_REALM="${KEYCLOAK_REALM:-jaraco}"
KEYCLOAK_DISCOVERY_URL="${KEYCLOAK_DISCOVERY_URL:-https://keycloak.jarakube.com/realms/jaraco}"
OIDC_CLIENT_ID="${OIDC_CLIENT_ID:-vault}"
OIDC_DEFAULT_ROLE="${OIDC_DEFAULT_ROLE:-reader}"
OIDC_ADMIN_ROLE_CLAIM="${OIDC_ADMIN_ROLE_CLAIM:-admin}"
OIDC_READER_ROLE_CLAIM="${OIDC_READER_ROLE_CLAIM:-reader}"
CA_SECRET_NAMESPACE="${CA_SECRET_NAMESPACE:-cert-manager}"
CA_SECRET_NAME="${CA_SECRET_NAME:-ca-key-pair}"
CA_SECRET_KEY="${CA_SECRET_KEY:-tls.crt}"

# Get Vault token
VAULT_TOKEN=$(kubectl get secret -n "$VAULT_NAMESPACE" "$VAULT_TOKEN_SECRET" -o jsonpath='{.data.token}' | base64 -d)

# Get Keycloak client secret
echo "Fetching Keycloak client secret..."
if [ -n "${KC_VAULT_CLIENT_SECRET:-}" ]; then
  KC_SECRET="$KC_VAULT_CLIENT_SECRET"
else
  KC_SECRET=$(kubectl get secret -n "$KEYCLOAK_NAMESPACE" keycloak-credentials -o jsonpath='{.data.client-secret}' | base64 -d)
fi

# Enable OIDC auth method
echo "Enabling OIDC auth method..."
kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault auth enable -path=auth/oidc oidc

# Configure OIDC
echo "Configuring OIDC..."
kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault write auth/oidc/config \
    oidc_discovery_url="$KEYCLOAK_DISCOVERY_URL" \
    oidc_client_id="$OIDC_CLIENT_ID" \
    oidc_client_secret="$KC_SECRET" \
    default_lease_ttl=3600 \
    max_lease_ttl=86400

# Create Vault policies
echo "Creating Vault policies..."

# Admin policy
kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault policy write admin infrastructure/vault/policies/admin.hcl

# Reader policy
kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault policy write reader infrastructure/vault/policies/reader.hcl

# Create OIDC roles
echo "Creating OIDC roles..."

# Admin role
kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault write auth/oidc/role/admin \
    bound_audiences="$OIDC_CLIENT_ID" \
    allowed_redirect_uris="$VAULT_EXTERNAL_URL/ui/vault/auth/oidc/callback" \
    allowed_redirect_uris="$VAULT_EXTERNAL_URL/v1/auth/oidc/callback" \
    user_claim="sub" \
    groups_claim="roles" \
    token_ttl=1h \
    token_max_ttl=4h \
    policies=admin

# Reader role
kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault write auth/oidc/role/reader \
    bound_audiences="$OIDC_CLIENT_ID" \
    allowed_redirect_uris="$VAULT_EXTERNAL_URL/ui/vault/auth/oidc/callback" \
    allowed_redirect_uris="$VAULT_EXTERNAL_URL/v1/auth/oidc/callback" \
    user_claim="sub" \
    groups_claim="roles" \
    token_ttl=1h \
    token_max_ttl=4h \
    policies=reader

# Get CA certificate for Vault
echo "Configuring CA certificate..."
CA_CERT=$(kubectl get secret -n "$CA_SECRET_NAMESPACE" "$CA_SECRET_NAME" -o jsonpath="{.data.$CA_SECRET_KEY}" | base64 -d)

kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault write auth/oidc/config \
    oidc_discovery_url="$KEYCLOAK_DISCOVERY_URL" \
    oidc_client_id="$OIDC_CLIENT_ID" \
    oidc_client_secret="$KC_SECRET" \
    default_lease_ttl=3600 \
    max_lease_ttl=86400 \
    signing_algs=RS256

# Create CA secret in Vault
echo "Creating CA secret in Vault..."
kubectl exec -n "$VAULT_NAMESPACE" deploy/vault -c vault -- \
  vault kv put kv/jaraco/ca ca_cert="$CA_CERT"

echo "Vault OIDC configuration completed successfully!"

---
# Vault policy examples

# admin.hcl
path "*" {
  capabilities = ["create", "read", "update", "delete", "list", "sudo"]
}

# reader.hcl
path "kv/jaraco/*" {
  capabilities = ["read", "list"]
}

path "kv/jaraco/data/*" {
  capabilities = ["read"]
}

path "sys/policies" {
  capabilities = ["list"]
}

---
# Vault KV secrets examples

# Create a secret in Vault
kubectl exec -n vault deploy/vault -c vault -- \
  vault kv put kv/jaraco/dev \
    db-url="postgresql://localhost:5432/mydb" \
    db-username="myuser" \
    db-password="mypassword"

# Create a secret with versioning
kubectl exec -n vault deploy/vault -c vault -- \
  vault kv put kv/jaraco/prod \
    api-key="prod-api-key-123" \
    api-url="https://api.example.com"

# Read a secret
kubectl exec -n vault deploy/vault -c vault -- \
  vault kv get kv/jaraco/dev

# List secrets
kubectl exec -n vault deploy/vault -c vault -- \
  vault kv list kv/jaraco

---
# Vault database secrets engine example

# Enable database secrets engine
kubectl exec -n vault deploy/vault -c vault -- \
  vault secrets enable -path=database database

# Configure PostgreSQL connection
kubectl exec -n vault deploy/vault -c vault -- \
  vault write database/config/my-postgres \
    plugin_name=postgresql-database-plugin \
    connection_url="postgresql://{{username}}:{{password}}@postgres:5432/mydb?sslmode=disable" \
    allowed_roles="my-role" \
    username="admin" \
    password="admin-password"

# Create role for database credentials
kubectl exec -n vault deploy/vault -c vault -- \
  vault write database/roles/my-role \
    db_name=my-postgres \
    creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';" \
    default_ttl="1h" \
    max_ttl="24h"

# Generate database credentials
kubectl exec -n vault deploy/vault -c vault -- \
  vault read database/creds/my-role

---
# Vault PKI secrets engine for certificates

# Enable PKI secrets engine
kubectl exec -n vault deploy/vault -c vault -- \
  vault secrets enable pki

# Tune PKI to issue certificates for 1 year
kubectl exec -n vault deploy/vault -c vault -- \
  vault secrets tune -max-lease-ttl=8760h pki

# Generate root CA
kubectl exec -n vault deploy/vault -c vault -- \
  vault write pki/root/generate/internal \
    common_name="My CA" \
    ttl=8760h

# Create role for certificates
kubectl exec -n vault deploy/vault -c vault -- \
  vault write pki/roles/my-role \
    allowed_domains="jarakube.com" \
    allow_subdomains=true \
    max_ttl="720h"

# Issue a certificate
kubectl exec -n vault deploy/vault -c vault -- \
  vault write pki/issue/my-role \
    common_name="app.jarakube.com" \
    ttl=24h
