# ExternalSecret Examples for k8s-operations
# These examples show how to create ExternalSecrets for various use cases

---
# Basic ExternalSecret for a single secret

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: simple-secret
  namespace: develop
  labels:
    app: my-app
    environment: develop
    managed-by: flux
spec:
  # How often to refresh the secret from Vault
  refreshInterval: "60m"
  
  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  
  # The Kubernetes secret that will be created/updated
  target:
    name: my-app-secret
    # Optional: specify the type of secret (default: Opaque)
    # creationPolicy: Owner
    # deletionPolicy: Retain
  
  # The data to fetch from Vault
  data:
  - secretKey: database-password
    remoteRef:
      # The key in Vault (path)
      key: "dev"
      # The property/field in the Vault secret
      property: "db-password"
      # Optional: specify the version of the secret
      # version: "1"

---
# ExternalSecret with multiple properties

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: multi-property-secret
  namespace: develop
spec:
  refreshInterval: "30m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: app-config
  data:
  - secretKey: db-url
    remoteRef:
      key: "dev"
      property: "database-url"
  - secretKey: db-user
    remoteRef:
      key: "dev"
      property: "database-username"
  - secretKey: db-password
    remoteRef:
      key: "dev"
      property: "database-password"
  - secretKey: api-key
    remoteRef:
      key: "dev"
      property: "api-key"

---
# ExternalSecret with different Vault paths

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: multi-path-secret
  namespace: develop
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: combined-secret
  data:
  - secretKey: app-secret
    remoteRef:
      key: "dev/app-secrets"
      property: "secret-key"
  - secretKey: db-secret
    remoteRef:
      key: "dev/database"
      property: "connection-string"
  - secretKey: auth-secret
    remoteRef:
      key: "common/auth"
      property: "token"

---
# ExternalSecret with template (advanced)

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: templated-secret
  namespace: develop
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: templated-config
    template:
      engineVersion: v2
      templateFrom:
      - configMapKeyRef:
          name: secret-template
          key: template
  dataFrom:
  - find:
      name:
        regex: "dev.*"
      path: "kv/jaraco"

---
# ExternalSecret for production environment

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: prod-app-secret
  namespace: production
spec:
  refreshInterval: "15m"  # More frequent refresh in production
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: prod-app-secret
  data:
  - secretKey: db-password
    remoteRef:
      key: "prod"  # Production path in Vault
      property: "app-db-password"
  - secretKey: redis-password
    remoteRef:
      key: "prod"
      property: "redis-password"

---
# ExternalSecret with JSON data

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: json-secret
  namespace: develop
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: json-config
  data:
  - secretKey: config.json
    remoteRef:
      key: "dev"
      property: "config"
      # If the property in Vault is a JSON object, it will be stored as-is

---
# ClusterSecretStore configuration (reference)

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # Vault server URL
      server: "http://vault.vault.svc.cluster.local:8200"
      
      # Path in Vault where secrets are stored
      path: "kv/jaraco"
      
      # Vault KV engine version
      version: "v2"
      
      # Authentication method
      auth:
        tokenSecretRef:
          # Secret containing the Vault token
          name: "vault-token"
          namespace: "vault"
          key: "token"

---
# ExternalSecret with different authentication (Kubernetes auth)

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-k8s-auth
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "kv/jaraco"
      version: "v2"
      auth:
        # Use Kubernetes service account authentication
        kubernetes:
          role: "external-secrets-role"
          secretRef:
            name: "vault-k8s-auth-secret"
            namespace: "external-secrets"
            key: "token"
