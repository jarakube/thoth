# Docker Compose for easy access to the agent container.
#
# Quick start:
#   cp .env.example .env        # optional: add provider keys, set WORKSPACE_DIR
#   docker compose up -d --build
#   docker compose exec thoth bash
#
# One-shot interactive session (container removed on exit):
#   docker compose run --rm thoth
#
# Start OpenCode or goose directly:
#   docker compose run --rm thoth opencode
#   docker compose run --rm thoth goose
#
# Prometheus metrics: http://localhost:9464/metrics
#
# Mount layout - user-generated data stays on the host filesystem:
#   ${WORKSPACE_DIR:-./workspace}  -> /workspace  (agent working dir; a goosetown
#                                       clone is created at /workspace/goosetown
#                                       on first start - all goosetown env
#                                       points there)
#   ./share/opencode-runs          -> /app/share/opencode-runs (per-run artifacts, gitignored)
#   opencode-data (named volume)   -> /home/appuser/.local/share/opencode (auth/sessions)
#
# Permissions: the container runs as appuser (uid 1000). Host bind-mount
# directories must exist and be writable by uid 1000 - the defaults ship
# .gitkeep files so they exist with your ownership after clone. Docker
# creates MISSING bind-mount directories as root; if you point WORKSPACE_DIR
# at your own project it already exists with your ownership. Nothing on the
# host is ever chowned by this file. The opencode-data volume needs no init
# either: docker seeds a fresh volume's content and ownership from the image
# directory on first use.

services:
  thoth:
    build:
      context: .
      args:
        # Match the in-container appuser to the host user, so host bind
        # mounts (workspace, goosetown-data, share/opencode-runs) are
        # writable by the agent without any chown on the host.
        # `make up` / `make build` pass these automatically from id -u/-g;
        # with plain docker compose, set them in .env or the environment.
        APP_UID: ${HOST_UID:-1000}
        APP_GID: ${HOST_GID:-1000}
    image: thoth:latest
    container_name: thoth
    # To run a published image instead of building locally, comment out
    # `build:` and point `image:` at your registry, e.g.:
    # image: ghcr.io/<owner>/<repo>:latest
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    # Interactive bash by default; override with
    # `docker compose run --rm thoth <command>`
    command: bash
    restart: unless-stopped
    ports:
      - "${OPENCODE_METRICS_PORT:-9464}:${OPENCODE_METRICS_PORT:-9464}"
    environment:
      # LLM provider keys (all optional, passed through from .env / shell)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # --- Shared LLM endpoint (single source of truth) -------------------
      # Configure once; scripts/sync-llm-config.sh writes BOTH the OpenCode
      # config (custom openai-compatible provider) and the goose config
      # (built-in litellm provider) from these variables at container start.
      # LLM_ENDPOINT must include the /v1 path, e.g. http://litellm-proxy:4000/v1
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      # Name of the env var carrying the API key (referenced, not copied)
      LLM_API_KEY_ENV: ${LLM_API_KEY_ENV:-CUSTOM_LITELLM_API_KEY}
      # Space/comma-separated model IDs served by the endpoint
      LLM_MODELS: ${LLM_MODELS:-mistral-small-latest mistral-large-latest}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
      # The API key itself: either as an environment variable (above), or -
      # preferred - as a docker compose SECRET (see secrets: below), e.g.
      # exported from `pass show path/to/llm-key`. The sync script reads
      # whichever is set.
      CUSTOM_LITELLM_API_KEY: ${CUSTOM_LITELLM_API_KEY:-}
      # Goose defaults
      GOOSE_LLM_PROVIDER: ${GOOSE_LLM_PROVIDER:-mistral}
      GOOSE_LLM_MODEL: ${GOOSE_LLM_MODEL:-mistral-small-latest}
      # Metrics exporter (see scripts/opencode-prometheus-exporter.py)
      OPENCODE_METRICS_ENABLED: ${OPENCODE_METRICS_ENABLED:-1}
      OPENCODE_METRICS_PORT: ${OPENCODE_METRICS_PORT:-9464}
      # Per-run artifacts land on the host (bind mount below)
      OPENCODE_RUN_METRICS_DIR: /app/share/opencode-runs
      # GPG: reuse host keys. Either mount the whole host keyring
      # (uncomment the volume below) or import an armored key export at
      # startup (GPG_IMPORT_FILE). The entrypoint cleans host daemon
      # state (dead sockets, stale locks) in mount mode.
      GPG_IMPORT_FILE: ${GPG_IMPORT_FILE:-/dev/null}
      # Optionally trust imported keys ultimately (ownertrust 6):
      # GPG_TRUST_IMPORTED: ${GPG_TRUST_IMPORTED:-0}
      # Goosetown: a working clone is created at /workspace/goosetown on
      # first start. Set here as container env so ALL shells see them (also
      # non-interactive `docker compose exec bash -c`), not just PID 1.
      # Override GOOSETOWN_DIR (and friends) in .env, not here, so the
      # derived paths follow your override.
      GOOSETOWN_DIR: ${GOOSETOWN_DIR:-/workspace/goosetown}
      GUIDES_DIR: ${GOOSETOWN_DIR:-/workspace/goosetown}/GUIDES
      PLANS_DIR: ${GOOSETOWN_DIR:-/workspace/goosetown}/PLANS
      RESEARCH_DIR: ${GOOSETOWN_DIR:-/workspace/goosetown}/RESEARCH
      WORK_LOGS_DIR: ${GOOSETOWN_DIR:-/workspace/goosetown}/WORK_LOGS
      GOOSETOWN_REPO_URL: ${GOOSETOWN_REPO_URL:-https://github.com/aaif-goose/goosetown.git}
      GOOSETOWN_REF: ${GOOSETOWN_REF:-}
    volumes:
      # Project directory the agent works on; goosetown is cloned INTO it at
      # workspace/goosetown (host-visible) on first start
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      # Per-run metrics artifacts (gitignored, inspectable on the host)
      - ./share/opencode-runs:/app/share/opencode-runs
      # OpenCode state: auth.json, sessions, storage. Named volume so
      # credentials do not land in the project directory; docker seeds its
      # ownership from the image on first use, so appuser can write.
      - opencode-data:/home/appuser/.local/share/opencode
      # --- Optional mounts (uncomment as needed) ---
      # Kubernetes cluster access:
      # - ${HOME}/.kube:/home/appuser/.kube:ro
      # SSH keys for git/gh over ssh (requires uid match with appuser, 1000):
      # - ${HOME}/.ssh:/home/appuser/.ssh:ro
      # GPG keyring - persists across container restarts (named volume).
      # Reuse host keys (see README "Use your GPG keys"):
      #  a) import an armored key export (recommended): mount the file
      #     and set GPG_IMPORT_FILE in .env - the entrypoint imports it
      #     into this volume on every start (idempotent)
      #  b) mount the whole host keyring instead: comment the gnupg-data
      #     volume line above AND uncomment here (stale daemon sockets and
      #     locks from the host are cleaned at startup):
      # - ${HOME}/.gnupg:/home/appuser/.gnupg
      # key export mount for (a):
      # - ${HOME}/thoth-gpg-key.asc:/home/appuser/gpg-key.asc:ro
      - gnupg-data:/home/appuser/.gnupg
    secrets:
      # Optional: LLM API key as a file (see the top-level secrets: block).
      # When LLM_API_KEY_FILE is unset this mounts an empty file
      # (/dev/null fallback) and the sync script ignores it.
      - llm_api_key
    healthcheck:
      # Healthy when the metrics endpoint answers, or when the exporter is
      # intentionally disabled (OPENCODE_METRICS_ENABLED=0).
      test: ["CMD-SHELL", "curl -sf http://localhost:$${OPENCODE_METRICS_PORT:-9464}/metrics > /dev/null || test \"$$OPENCODE_METRICS_ENABLED\" = 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opencode-data:
  gnupg-data:

secrets:
  # API key as a file instead of an env var - keeps the key out of
  # `docker inspect` and shell history. Point LLM_API_KEY_FILE at a file
  # produced by your secret manager, e.g.:
  #   pass show path/to/llm-key > /tmp/llm-key   (or use `make up`, which
  #   wires LLM_API_KEY_FILE via `pass` automatically when available)
  # Unset -> empty fallback; the sync script ignores an empty secret.
  llm_api_key:
    file: ${LLM_API_KEY_FILE:-/dev/null}
