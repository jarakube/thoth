{{- if .Values.vault.enabled }}
{{- $fullname := include "thoth.fullname" . }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-llm
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: {{ .Values.vault.store.kind }}
    name: {{ .Values.vault.store.name }}
  refreshInterval: {{ .Values.vault.refreshInterval }}
  target:
    name: {{ $fullname }}-llm
  data:
    - secretKey: llm_api_key
      remoteRef:
        key: {{ .Values.vault.llm.key }}
        property: {{ .Values.vault.llm.property }}
---
{{- if .Values.vault.gpg.key }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-gpg
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: {{ .Values.vault.store.kind }}
    name: {{ .Values.vault.store.name }}
  refreshInterval: {{ .Values.vault.refreshInterval }}
  target:
    name: {{ $fullname }}-gpg
  data:
    - secretKey: gpg-key.asc
      remoteRef:
        key: {{ .Values.vault.gpg.key }}
        property: {{ .Values.vault.gpg.property }}
{{- end }}
---
{{- if .Values.vault.registry.key }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-pull
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    kind: {{ .Values.vault.store.kind }}
    name: {{ .Values.vault.store.name }}
  refreshInterval: {{ .Values.vault.refreshInterval }}
  target:
    name: {{ $fullname }}-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ .Values.imagePullSecret.registry }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}","auth":"{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.vault.registry.key }}
        property: {{ .Values.vault.registry.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.registry.key }}
        property: {{ .Values.vault.registry.passwordProperty }}
{{- end }}
{{- end }}
