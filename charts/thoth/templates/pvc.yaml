{{- if .Values.workspace.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "thoth.fullname" . }}-workspace
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.workspace.persistence.accessModes | nindent 4 }}
  {{- with .Values.workspace.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspace.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "thoth.fullname" . }}-opencode
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.state.opencode.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.state.opencode.size }}
