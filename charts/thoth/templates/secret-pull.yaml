{{- if and .Values.imagePullSecret.enabled (not .Values.imagePullSecret.existingSecret) (not .Values.vault.enabled) .Values.imagePullSecret.username }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thoth.fullname" . }}-pull
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict .Values.imagePullSecret.registry (dict "username" .Values.imagePullSecret.username "password" .Values.imagePullSecret.password "auth" (printf "%s:%s" .Values.imagePullSecret.username .Values.imagePullSecret.password | b64enc))) | toJson | quote }}
{{- end }}
