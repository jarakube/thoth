{{- if and (not .Values.llm.existingSecret) .Values.llm.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thoth.llmSecretName" . }}
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
type: Opaque
stringData:
  # mounted at /run/secrets/llm_api_key - the same path the compose
  # secret uses, so the entrypoint contract is identical
  llm_api_key: {{ .Values.llm.apiKey | quote }}
{{- end }}
