{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "thoth.fullname" . }}
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "thoth.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      path: /metrics
{{- end }}
