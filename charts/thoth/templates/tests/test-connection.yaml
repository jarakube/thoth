apiVersion: v1
kind: Pod
metadata:
  name: {{ include "thoth.fullname" . }}-test-connection
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - curl -sf http://{{ include "thoth.fullname" . }}:{{ .Values.service.port }}/metrics | grep -q opencode_exporter_up
