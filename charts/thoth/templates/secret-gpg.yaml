{{- if and (not .Values.gpg.existingSecret) .Values.gpg.importKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "thoth.gpgSecretName" . }}
  labels:
    {{- include "thoth.labels" . | nindent 4 }}
type: Opaque
stringData:
  gpg-key.asc: |-
{{ .Values.gpg.importKey | indent 4 }}
{{- end }}
