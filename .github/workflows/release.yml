name: Release

# Release pipeline: a pushed tag matching v* builds, scans, and
# publishes a tagged container image, and creates a GitHub Release with
# the image reference and provenance.
#
# Tag pushes are owner-controlled (protected), so this workflow runs
# WITHOUT the ready-for-test gate that PR builds require. DCO is
# enforced on every commit by dco.yml.
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Published image tags for vX.Y.Z:
#   ghcr.io/jarakube/thoth:vX.Y.Z     (the tag itself)
#   ghcr.io/jarakube/thoth:X.Y        (major.minor, for patch streams)
#   ghcr.io/jarakube/thoth:X          (major, for minor streams)
#   ghcr.io/jarakube/thoth:latest     (only for the newest semver tag)

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the image

jobs:
  release:
    name: Build and publish tagged image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: image-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver tags: v2.3.1 -> 2.3.1, 2.3, 2, and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=latest
          labels: |
            org.opencontainers.image.title=thoth
            org.opencontainers.image.description=Containerized agent environment: OpenCode + goose/goosetown + kubectl

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # scan the exact digest that was pushed (immune to tag drift)
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Collect release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail
          # notes: the tag, the image reference, and the tag history
          {
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${TAG}"
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            echo '```'
            echo
            echo "Published tags: \`${TAG}\`, \`${TAG#v}\` (major.minor and major streams), \`latest\`."
            echo
            echo "Trivy scan: CRITICAL/HIGH (unfixed only) - passed."
            echo
            echo "## Changes since the previous release"
            echo
          } > notes.md
          # changelog: commits between the previous tag and this one
          PREV_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)"
          if [ -n "$PREV_TAG" ]; then
            git log --oneline "${PREV_TAG}..${TAG}" >> notes.md
          else
            git log --oneline "${TAG}" | head -50 >> notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # GH_REPO set: gh targets this repo without git detection
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag
