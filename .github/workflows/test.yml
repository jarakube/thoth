name: Test

# Unit tests for the entrypoint and sync scripts (bats) plus shellcheck
# linting. On pull requests, gated behind the owner's "ready for test"
# comment (same gate as the image build); pushes to main always run.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-gate:
    name: Test gate (ready for test)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Check out repository
        # local composite actions (uses: ./...) need the repo checked out
        # before they can be referenced
        uses: actions/checkout@v4
      - name: Ready for test gate
        id: gate
        uses: ./.github/actions/ready-for-test-gate
        with:
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          token: ${{ github.token }}

  unit:
    name: Unit tests (bats + shellcheck)
    needs: test-gate
    # test-gate is skipped on non-PR events, so its result is 'skipped'
    # there - always() + the explicit condition keeps main-branch tests
    # running while PR tests require the gate to have passed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.test-gate.outputs.approved == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install bats and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Shellcheck
        run: |
          # entrypoint is sourced by tests (functions + main guard), so
          # override the source-guard warning
          shellcheck --severity=error scripts/*.sh test/run-tests.sh || {
            echo "shellcheck found errors"; exit 1; }

      - name: Unit tests
        run: ./test/run-tests.sh
