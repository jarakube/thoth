name: Build

on:
  push:
    branches:
      - main
  pull_request:
  # NOTE: no workflow_dispatch on purpose - a dispatch on a PR branch
  # would skip the build gate (event_name != 'pull_request'). The gate
  # is the only path for PR image builds.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Gate: on pull requests, image build/push only runs after the REPO
  # OWNER has commented "ready for test" on the PR - and the approval
  # must be CURRENT: new commits pushed to the PR branch invalidate it,
  # the owner must comment again. Pushes to main always run.
  build-gate:
    name: Build gate (ready for test)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Check out repository
        # local composite actions (uses: ./...) need the repo checked out
        # before they can be referenced
        uses: actions/checkout@v7
      - name: Ready for test gate
        id: gate
        uses: ./.github/actions/ready-for-test-gate
        with:
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          token: ${{ github.token }}

  build:
    name: Build image
    needs: build-gate
    # build-gate is skipped on non-PR events, so its result is 'skipped'
    # there - always() + the explicit condition keeps main-branch builds
    # running while PR builds require the gate to have passed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.build-gate.outputs.approved == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: image-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        id: trivy-scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan by DIGEST (output of the build-push step), not by tag:
          # metadata-action produces 'sha-<short>' tags, so a
          # ':${{ github.sha }}' tag never exists in the registry.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
