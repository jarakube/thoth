name: Build

on:
  push:
    branches:
      - main
  pull_request:
  # NOTE: no workflow_dispatch on purpose - a dispatch on a PR branch
  # would skip the build gate (event_name != 'pull_request'). The gate
  # is the only path for PR image builds.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Gate: on pull requests, image build/push only runs after the REPO
  # OWNER has commented "ready for test" on the PR - and the approval
  # must be CURRENT: new commits pushed to the PR branch invalidate it,
  # the owner must comment again. Pushes to main always run.
  build-gate:
    name: Build gate (ready for test)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Check for owner "ready for test" comment
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Gate policy: the REPO OWNER must have commented exactly
          # "ready for test", and the approval must be CURRENT: if any
          # commit was pushed to the PR branch AFTER that comment, the
          # approval is stale and the owner must comment again.
          comments="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate)"
          owner_login="$(gh api "repos/${REPO}" --jq '.owner.login')"
          approved="false"
          # find the LATEST owner approval comment (id = newest last)
          approval_comment_id=""
          while IFS= read -r line; do
            login="$(jq -r '.user.login' <<<"$line")"
            body="$(jq -r '.body' <<<"$line")"
            cid="$(jq -r '.id' <<<"$line")"
            if [ "$body" = "ready for test" ] && [ "$login" = "$owner_login" ]; then
              approved="true"
              approval_comment_id="$cid"
            fi
          done < <(jq -c '.[]' <<<"$comments" 2>/dev/null || echo "[]")

          if [ "$approved" = "true" ]; then
            # Staleness check via the PR timeline (chronological): if any
            # 'committed' event appears AFTER the owner's approval
            # comment, new commits were pushed since the approval.
            timeline="$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/issues/${PR_NUMBER}/timeline" --paginate)"
            stale_commits="$(jq -r --arg cid "$approval_comment_id" '
              [ .[] | select(.event == "commented" or .event == "committed") ]
              | (map(.event == "commented" and (.id|tostring) == $cid) | index(true)) as $cpos
              | if $cpos == null then 0
                else [ .[($cpos+1):][] | select(.event == "committed") ] | length end
            ' <<<"$timeline")"
            if [ "${stale_commits:-0}" -gt 0 ]; then
              approved="false"
              echo "Gate blocked: ${stale_commits} commit(s) were pushed to the PR after the owner's 'ready for test' comment."
              echo "The repo owner must comment 'ready for test' again for the new commits."
            else
              echo "Gate open: '${owner_login}' commented 'ready for test' and no commits were pushed after it"
            fi
          fi
          if [ "$approved" != "true" ]; then
            echo "Build blocked: no current 'ready for test' approval from repo owner ('${owner_login}') on PR #${PR_NUMBER}"
          fi
          echo "approved=${approved}" >> "$GITHUB_OUTPUT"

  build:
    name: Build image
    needs: build-gate
    # build-gate is skipped on non-PR events, so its result is 'skipped'
    # there - always() + the explicit condition keeps main-branch builds
    # running while PR builds require the gate to have passed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.build-gate.outputs.approved == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: image-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        id: trivy-scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scan by DIGEST (output of the build-push step), not by tag:
          # metadata-action produces 'sha-<short>' tags, so a
          # ':${{ github.sha }}' tag never exists in the registry.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
